<svg xmlns="http://www.w3.org/2000/svg" class="rg-graph" viewBox="0 0 416 296" width="416" height="296" role="group" aria-label="The connections the Augment API returned for a single identifier: a researcher linked through research data, a grant or a publication to another researcher, and that researcher to an organisation">
